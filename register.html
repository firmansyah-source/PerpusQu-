<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Akun Baru - PerpusQu</title>
  
  <!-- Font Poppins & Font Awesome 6 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="register.css">
</head>
<body>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <main class="auth-wrapper">
    <div class="auth-card">
      
      <!-- Header Registrasi -->
      <div class="brand-header">
        <div class="logo-circle">
          <i class="fa-solid fa-user-plus logo-icon"></i>
        </div>
        <h1 class="brand-title">Buat Akun Baru</h1>
        <p class="brand-description">Bergabunglah untuk menikmati layanan PerpusQu</p>
      </div>

      <!-- Form Register -->
      <form id="registerForm" novalidate>
        
        <!-- Field Nama Lengkap -->
        <div class="form-group">
          <label for="regNama" class="form-label">Nama Lengkap</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-user input-icon-left"></i>
            <input 
              type="text" 
              id="regNama" 
              class="form-control" 
              placeholder="Masukkan nama lengkap"
            >
          </div>
          <span class="error-text" id="namaError"></span>
        </div>

        <!-- Field Username -->
        <div class="form-group">
          <label for="regUsername" class="form-label">Username</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-user input-icon-left"></i>
            <input 
              type="text" 
              id="regUsername" 
              class="form-control" 
              placeholder="Buat username unik"
              autocomplete="username"
            >
          </div>
          <span class="error-text" id="usernameError"></span>
        </div>

        <!-- Field Kelas (Input Text) -->
        <div class="form-group">
          <label for="regKelas" class="form-label">Kelas</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-book input-icon-left"></i>
            <input 
              type="text" 
              id="regKelas" 
              class="form-control" 
              placeholder="Contoh: XI.4 atau XI IPA 1"
            >
          </div>
          <span class="error-text" id="kelasError"></span>
        </div>

        <!-- Field Password -->
        <div class="form-group">
          <label for="regPassword" class="form-label">Password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock input-icon-left"></i>
            <input 
              type="password" 
              id="regPassword" 
              class="form-control" 
              placeholder="Minimal 8 karakter"
              autocomplete="new-password"
            >
            <button type="button" class="password-toggle" id="toggleRegPasswordBtn" aria-label="Tampilkan password">
              <i class="fa-solid fa-eye" id="regPasswordIcon"></i>
            </button>
          </div>
          <span class="error-text" id="passwordError"></span>
        </div>

        <!-- Field Konfirmasi Password -->
        <div class="form-group">
          <label for="regConfirmPassword" class="form-label">Konfirmasi Password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock input-icon-left"></i>
            <input 
              type="password" 
              id="regConfirmPassword" 
              class="form-control" 
              placeholder="Ulangi password"
              autocomplete="new-password"
            >
            <button type="button" class="password-toggle" id="toggleConfirmPasswordBtn" aria-label="Tampilkan konfirmasi password">
              <i class="fa-solid fa-eye" id="confirmPasswordIcon"></i>
            </button>
          </div>
          <span class="error-text" id="confirmPasswordError"></span>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-primary" id="btnRegister">
          <i class="fa-solid fa-user-plus"></i>
          <span>Daftar</span>
        </button>

      </form>

      <!-- Footer Navigasi -->
      <div class="auth-footer">
        <p>Sudah punya akun? <a href="login.html" class="auth-link">Masuk</a></p>
      </div>

    </div>
  </main>

  <!-- JavaScript Scripts -->
  <script src="register.js"></script>
</body>
</html>
