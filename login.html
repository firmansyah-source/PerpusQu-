<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - PerpusQu</title>
  
  <!-- Font Poppins & Font Awesome 6 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <main class="auth-wrapper">
    <div class="auth-card">
      
      <!-- Brand Header -->
      <div class="brand-header">
        <div class="logo-circle">
          <i class="fa-solid fa-book logo-icon"></i>
        </div>
        <h1 class="brand-title">PerpusQu</h1>
        <p class="brand-description">Perpustakaan Digital Pintar & Modern</p>
      </div>

      <!-- Form Login -->
      <form id="loginForm" novalidate>
        
        <!-- Field Username -->
        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-user input-icon-left"></i>
            <input 
              type="text" 
              id="username" 
              class="form-control" 
              placeholder="Masukkan username" 
              autocomplete="username"
            >
          </div>
          <span class="error-text" id="usernameError"></span>
        </div>

        <!-- Field Password -->
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock input-icon-left"></i>
            <input 
              type="password" 
              id="password" 
              class="form-control" 
              placeholder="Masukkan password" 
              autocomplete="current-password"
            >
            <button type="button" class="password-toggle" id="togglePasswordBtn" aria-label="Tampilkan password">
              <i class="fa-solid fa-eye" id="passwordIcon"></i>
            </button>
          </div>
          <span class="error-text" id="passwordError"></span>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-primary" id="btnLogin">
          <i class="fa-solid fa-right-to-bracket"></i>
          <span>Login</span>
        </button>

      </form>

      <!-- Footer Navigasi -->
      <div class="auth-footer">
        <p>Belum punya akun? <a href="register.html" class="auth-link">Daftar Sekarang</a></p>
      </div>

    </div>
  </main>

  <!-- JavaScript Scripts -->
  <script src="register.js"></script>
  <script src="login.js"></script>
</body>
</html>
